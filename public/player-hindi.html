<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOVIE REDX - Hindi Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #player-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 15, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(229, 9, 20, 0.2);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f1f5f9;
    }
    .badge-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      gap: 8px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }
    #player-container:hover .badge-bar {
      opacity: 1;
    }
    .badge {
      background: rgba(20, 20, 25, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge.hindi {
      background: linear-gradient(135deg, rgba(255, 153, 51, 0.3), rgba(19, 136, 8, 0.3));
      border-color: rgba(255, 153, 51, 0.5);
      color: #ffca80;
    }
    .error-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
      max-width: 420px;
    }
    .error-box h3 { color: #f87171; font-size: 1.1rem; }
    .error-box p { color: #94a3b8; font-size: 0.85rem; line-height: 1.4; }
    .btn-retry {
      background: #e50914;
      color: #fff;
      border: 0;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="player-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text" id="status-text">🇮🇳 Loading Hindi Dubbed Stream...</div>
      <div class="error-box" id="error-box">
        <h3>Hindi Stream Unavailable</h3>
        <p id="error-desc">Switching to alternate Hindi server...</p>
        <button class="btn-retry" onclick="fallbackToEmbed()">Switch to Backup Player</button>
      </div>
    </div>

    <div class="badge-bar">
      <span class="badge hindi" id="hindi-badge">🇮🇳 Hindi Dubbed</span>
      <span class="badge" id="quality-badge">720p HD</span>
    </div>

    <video id="video-player" controls playsinline autoplay preload="auto"></video>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const tmdbId = params.get('id') || params.get('tmdb') || '550';
    const type = params.get('type') || 'movie';
    const season = params.get('s') || params.get('season') || '1';
    const episode = params.get('e') || params.get('episode') || '1';

    const video = document.getElementById('video-player');

    // Automatic Audio Volume Booster (+250%)
    let audioCtx = null;
    let gainNode = null;

    function applyAudioBoost() {
      try {
        video.volume = 1.0;
        video.muted = false;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass && !audioCtx) {
          audioCtx = new AudioContextClass();
          const source = audioCtx.createMediaElementSource(video);
          gainNode = audioCtx.createGain();
          gainNode.gain.value = 2.5; // +250% automatic volume boost
          source.connect(gainNode);
          gainNode.connect(audioCtx.destination);
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (gainNode) gainNode.gain.value = 2.5;
      } catch (e) {
        console.log('Audio boost notice:', e.message);
      }
    }

    video.addEventListener('play', applyAudioBoost);
    video.addEventListener('playing', applyAudioBoost);
    document.addEventListener('click', applyAudioBoost);
    document.addEventListener('touchstart', applyAudioBoost, { passive: true });

    const overlay = document.getElementById('loading-overlay');
    const statusText = document.getElementById('status-text');
    const errorBox = document.getElementById('error-box');
    const errorDesc = document.getElementById('error-desc');
    const qualityBadge = document.getElementById('quality-badge');

    let fallbackUrl = type === 'tv' 
      ? `https://vidlink.pro/tv/${tmdbId}/${season}/${episode}?primaryLang=hi&autoplay=true&title=true`
      : `https://vidlink.pro/movie/${tmdbId}?primaryLang=hi&autoplay=true&title=true`;

    async function init() {
      try {
        statusText.textContent = '🇮🇳 Fetching Hindi Dubbed Audio Stream...';
        const res = await fetch(`/api/stream/hindi?tmdb=${encodeURIComponent(tmdbId)}&type=${type}&s=${season}&e=${episode}`);
        if (!res.ok) throw new Error('Failed to resolve Hindi audio');
        const data = await res.json();

        if (data.success && data.type === 'hls' && data.url) {
          playHls(data.url);
        } else if (data.success && data.type === 'embed' && data.url) {
          loadIframe(data.url);
        } else {
          fallbackToEmbed();
        }
      } catch (err) {
        console.warn('Hindi resolver error, loading fallback:', err);
        fallbackToEmbed();
      }
    }

    function playHls(m3u8Url) {
      statusText.textContent = 'Connecting to HD Hindi Stream...';
      if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          backBufferLength: 90
        });
        hls.loadSource(m3u8Url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          overlay.style.opacity = '0';
          setTimeout(() => { overlay.style.display = 'none'; }, 300);
          video.play().catch(() => {
            // Autoplay blocked, wait for user click
          });
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error('Fatal HLS error:', data.type);
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                fallbackToEmbed();
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native Safari/iOS HLS support
        video.src = m3u8Url;
        video.addEventListener('loadedmetadata', () => {
          overlay.style.opacity = '0';
          setTimeout(() => { overlay.style.display = 'none'; }, 300);
          video.play().catch(() => {});
        });
        video.addEventListener('error', () => {
          fallbackToEmbed();
        });
      } else {
        fallbackToEmbed();
      }
    }

    function loadIframe(url) {
      overlay.style.opacity = '0';
      setTimeout(() => { overlay.style.display = 'none'; }, 300);
      const container = document.getElementById('player-container');
      container.innerHTML = `<iframe src="${url}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`;
    }

    function fallbackToEmbed() {
      loadIframe(fallbackUrl);
    }

    init();
  </script>
</body>
</html>
